  phone_form_field: 10.0.17
  
  # Loading indicators
  loading_animation_widget: ^1.2.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/dowell_logo.png
name: dowell_app
description: ""

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.7.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10
  flutter_riverpod: ^2.4.9
  image_picker: ^1.0.4
  cached_network_image: ^3.3.0
  path_provider: ^2.1.0
  form_validator: ^1.0.0
  phone_form_field: 10.0.17
  loading_animation_widget: ^1.2.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.11.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/dowell_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/dowell_logo.png"
  adaptive_icon_background: "#ffffff"
name: dowell_app
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
    # Firebase Authentication
  firebase_core: ^3.7.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.6.12
  
  # State Management (Riverpod - easier than Provider)
  flutter_riverpod: ^2.4.9
  
  # Form validation
  form_validator: ^1.0.0

  # Phone validation
  phone_form_field: 10.0.17
  
  # Loading indicators
  loading_animation_widget: ^1.2.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/dowell_logo.png
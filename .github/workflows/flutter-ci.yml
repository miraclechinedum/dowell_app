name: Flutter CI/CD

# CI checks run on pushes, pull requests and manual runs. Publishing to Google
# Play or the App Store never happens automatically: both publish jobs are
# disabled until the repository owner completes the release prerequisites
# listed in the "Publishing: DISABLED" section below.

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend_security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      # Emulator suites use the offline demo-dowell project; nothing is deployed.
      - name: Functions checks
        working-directory: functions
        run: |
          node --version
          npm run lint
          npm run build
          npm test
          npm run test:rules
          npm run test:storage-rules
          npm run test:referrals
          npm run test:tasks
          npm run test:admin-finance
          npm run test:account-deletion
          npm run test:reconciliation

  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: stable

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Flutter pub get
        run: flutter pub get

      # Analyzer errors fail CI. Warnings and infos are reported but not fatal:
      # the codebase has known pre-existing warnings. Once they are fixed, switch
      # to --fatal-warnings. Publishing never depends on this step's outcome.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      # Compile check only. CI has no release keystore, so this bundle is not
      # signed for Google Play and is not published.
      - name: Build Android App Bundle (compile check)
        run: flutter build appbundle --release

  # ─── Publishing: DISABLED ──────────────────────────────────────────────────
  # Prerequisites before the repository owner may enable a publish job:
  #  1. Backend deployed to dowell-pest-control-prod (indexes, Functions, rules)
  #     and smoke tests approved.
  #  2. A GitHub Environment (play-internal / app-store) with required
  #     reviewers, configured in the repository settings.
  #  3. Android: release signing configured from secrets (upload keystore +
  #     key.properties) in this job; Play service account secret present.
  #  4. iOS: App Store Connect bundle ID confirmed by the store account holder
  #     (local Xcode/Firebase config uses com.dowell.dowellapp).
  # To enable, replace `if: false` with `if: github.event_name == 'workflow_dispatch'`
  # and keep the environment gate.

  deploy_android:
    needs: [build_and_test, backend_security]
    runs-on: ubuntu-latest
    if: false
    environment: play-internal

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.dowell.pestcontrol
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal

  deploy_ios:
    needs: [build_and_test, backend_security]
    runs-on: macos-latest
    if: false
    environment: app-store
    env:
      # Secrets cannot be referenced in step-level `if:`; expose presence flags.
      HAS_APPSTORE_CERT: ${{ secrets.APPSTORE_CERT_BASE64 != '' }}
      HAS_PROVISIONING_PROFILE: ${{ secrets.APPSTORE_PROVISIONING_PROFILE_BASE64 != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: stable

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Flutter pub get
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Import Apple signing certificate
        if: env.HAS_APPSTORE_CERT == 'true'
        uses: apple-actions/import-codesign-certs@v1
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERT_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERT_PASSWORD }}

      - name: Import provisioning profile
        if: env.HAS_PROVISIONING_PROFILE == 'true'
        uses: apple-actions/import-provisioning-profiles@v1
        with:
          provisioning-profile-base64: ${{ secrets.APPSTORE_PROVISIONING_PROFILE_BASE64 }}

      - name: Build iOS IPA
        run: flutter build ipa --release --export-method app-store

      - name: Upload to App Store
        uses: appleboy/app-store-release@v1
        with:
          app_password: ${{ secrets.APP_STORE_CONNECT_APP_PASSWORD }}
          ipa: build/ios/ipa/Runner.ipa
          skip_metadata: true
          skip_screenshots: true
          submit_for_review: false
